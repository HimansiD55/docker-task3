name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy_to_dockerhub:
    name: Deploy to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and tag Docker images
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/docker-task3:latest .
          docker tag ${{ secrets.DOCKER_USERNAME }}/docker-task3:latest ${{ secrets.DOCKER_USERNAME }}/docker-task3:${{ github.run_number }}

      - name: Push images to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/docker-task3:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/docker-task3:${{ github.run_number }}
